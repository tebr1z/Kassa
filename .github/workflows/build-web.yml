name: Build RestaMarket web release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      SITE_URL: https://restamarket.az
      SEO_INDEXING: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:seo
      - run: node scripts/test-commerce.mjs
      - run: node scripts/test-variant-editor.mjs
      - run: node scripts/test-product-variants.mjs
      - run: node scripts/test-variant-selection.mjs
      - run: node scripts/test-product-discounts.mjs
      - run: node scripts/test-finance.mjs
      - run: node scripts/test-staff-onboarding.mjs
      - run: node scripts/test-google-address.mjs
      - run: node scripts/test-open-address.mjs
      - run: node scripts/test-open-geocoding.mjs
      - run: node scripts/test-customer-contact-validation.mjs
      - run: node scripts/test-terms-content.mjs
      - run: node scripts/test-terms-ui.mjs
      - run: node scripts/test-delivery-payment.mjs
      - run: node scripts/test-delivery.mjs
      - run: node scripts/test-account-ui.mjs
      - run: node scripts/test-language-switcher.mjs
      - run: node scripts/test-hydration-format.mjs
      - run: node scripts/test-checkout-contract.mjs
      - run: node scripts/test-account-contact.mjs
      - run: node scripts/test-staff-access.mjs
      - run: node scripts/test-staff-labels.mjs
      - run: node scripts/test-staff-portal.mjs
      - run: node scripts/test-product-removal.mjs
      - run: npm run test:account-translations
      - run: npm run build
      - name: Package Linux standalone runtime (no database or secrets)
        run: node scripts/package-web-release.mjs
        env:
          RELEASE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restamarket-web-${{ github.sha }}
          path: |
            web-release/*.tar.gz
            web-release/*.sha256
          if-no-files-found: error
          retention-days: 7
